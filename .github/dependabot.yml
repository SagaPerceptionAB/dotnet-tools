version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: [ "*" ]
    ignore:
      # Microsoft.AspNetCore.OpenApi 10 kräver Microsoft.OpenApi under 3.0.
      - dependency-name: "Microsoft.OpenApi*"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
