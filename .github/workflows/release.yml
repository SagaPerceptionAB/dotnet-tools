# Ger ut paket till organisationens GitHub Packages när en tagg skjuts: <komponent>/v<semver>, t.ex. testgen/v0.1.0-preview.1.
#   testgen/v*   -> SagaPerception.TestGen.Cli (verktyget) och SagaPerception.TestGen.NUnit (med Core, Excel, Mock, Browser och CommandLine inbakade)
#   systemmap/v* -> SagaPerception.SystemMap.Cli och SagaPerception.SystemMap.AspNetCore
#
# Paketen är privata som standard och får inte göras publika: det går inte att ångra.
# Att installera kräver en token med read:packages. Andra repons workflows behöver åtkomst via paketets "Manage Actions access".
# nuget.org kommer senare.
name: release

on:
  push:
    tags:
      - 'testgen/v*'
      - 'systemmap/v*'

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Bara commits på main får ges ut.
      - name: Kontrollera att taggen ligger på main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Taggen ${GITHUB_REF_NAME} pekar på en commit som inte finns på main. Merga till main och tagga därifrån."
            exit 1
          fi

      - name: Läs taggen
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          component="${tag%%/*}"
          version="${tag#*/v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::Taggen '$tag' har ingen giltig semver-version ('$version'). Exempel: $component/v1.2.3 eller $component/v1.2.3-beta.1"
            exit 1
          fi
          browser=""
          case "$component" in
            testgen)       projects="testgen/src/SagaPerception.TestGen.NUnit testgen/src/TestGen.Cli"; browser="testgen/tests/TestGen.Browser.Tests"; test="dotnet test testgen/testgen.slnx" ;;
            systemmap)     projects="systemmap/src/SystemMap.Cli systemmap/src/SystemMap.AspNetCore"; browser="systemmap/tests/SystemMap.Tests"; test="dotnet test systemmap/SystemMap.slnx" ;;
            *) echo "::error::Okänd komponent '$component'"; exit 1 ;;
          esac
          {
            echo "component=$component"
            echo "version=$version"
            echo "projects=$projects"
            echo "browser=$browser"
            echo "test=$test"
          } >> "$GITHUB_OUTPUT"
          echo "Ger ut $component $version ($projects)"

      # Versionen står i eng/Versions.props. Taggen får inte säga något annat: då släpps aldrig en version som repot inte känner till.
      - name: Kontrollera att taggen stämmer med eng/Versions.props
        shell: bash
        run: |
          set -euo pipefail
          for p in ${{ steps.tag.outputs.projects }}; do
            actual="$(dotnet msbuild "$p" -getProperty:Version | tr -d '[:space:]')"
            if [ "$actual" != "${{ steps.tag.outputs.version }}" ]; then
              echo "::error::Taggen ${GITHUB_REF_NAME} har versionen ${{ steps.tag.outputs.version }}, men $p har versionen '$actual' i eng/Versions.props. Höj versionen i eng/Versions.props, merga och tagga om."
              exit 1
            fi
            echo "$p: $actual stämmer med taggen"
          done

      # Testprojektet i browser kör Chromium (som i ci.yml).
      - name: Installera Chromium
        if: steps.tag.outputs.browser != ''
        shell: pwsh
        run: |
          dotnet build ${{ steps.tag.outputs.browser }}
          ${{ steps.tag.outputs.browser }}/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: ${{ steps.tag.outputs.test }}

      - name: Paketera
        shell: bash
        run: |
          set -euo pipefail
          for p in ${{ steps.tag.outputs.projects }}; do
            dotnet pack "$p" -c Release -o nupkg
          done
          ls -l nupkg

      - name: Kontrollera paketen
        run: eng/check-packages.sh nupkg 2

      # En CycloneDX-SBOM per paketprojekt, som bifogas körningen. Verktygets version är fast.
      - name: SBOM
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global CycloneDX --version 6.3.1
          mkdir sbom
          for p in ${{ steps.tag.outputs.projects }}; do
            dotnet-CycloneDX "$p" -o sbom -fn "$(basename "$p").cdx.json" -F Json
          done
          ls -l sbom

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ steps.tag.outputs.component }}
          path: sbom
          if-no-files-found: error
      # Symbolpaketen (*.snupkg) skjuts inte: GitHub Packages stöder dem inte.
      - name: Publicera till GitHub Packages
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --source https://nuget.pkg.github.com/SagaPerceptionAB/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
          --no-symbols
