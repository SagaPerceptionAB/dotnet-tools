openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
# Inloggning är valfri: det tomma alternativet {} betyder att anrop utan token också är tillåtna
# (exempel-API:et kräver token först om det startas med SHOPAPI_TOKEN).
security:
  - {}
  - bearerAuth: []
paths:
  /customers:
    post:
      operationId: createCustomer
      summary: Skapa kund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Skapad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Ogiltig indata
        '409':
          description: E-postadressen används redan
  /products:
    post:
      operationId: createProduct
      summary: Skapa produkt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Skapad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Ogiltig indata
  /orders:
    post:
      operationId: createOrder
      summary: Skapa order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Skapad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Ogiltig indata
        '404':
          description: Kund eller produkt saknas
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Hämta order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Hittades inte
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CustomerCreate:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
        personnummer:
          type: string
          example: "19900101-1239"
        status:
          type: string
          enum: [active, inactive]
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerCreate'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int32
    ProductCreate:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sku:
          type: string
          pattern: '^[A-Z]{3}-[0-9]{4}$'
        price:
          type: number
          format: double
          minimum: 0.01
          maximum: 100000
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductCreate'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int32
    OrderCreate:
      type: object
      required: [customerId, productId, quantity]
      properties:
        customerId:
          type: integer
          format: int32
        productId:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderCreate'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int32
            createdAt:
              type: string
              format: date-time
            discountPercent:
              type: integer
              description: 10 vid quantity över 5, annars 0
            totalPrice:
              type: number
              format: double
