<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sidan hämtar ingenting utifrån: allt den behöver finns i filen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Systemkarta – __TITLE__</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; color: #3b3b3b; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .empty { margin: 24px; padding: 8px 12px; background: #f8f8f8; border-left: 4px solid #767676; border-radius: 4px; }
  /* Sidan följer kartans tema (kartan sätter data-theme på sin rot): Light Modern och Dark Modern. */
  body:has(#map[data-theme=dark]) { background: #1f1f1f; color: #cccccc; color-scheme: dark; }
  body:has(#map[data-theme=dark]) .empty { background: #262626; border-left-color: #9d9d9d; }
  [hidden] { display: none !important; }
__STYLE__
</style>
</head>
<body>
<div id="map" hidden></div>
<p class="empty" id="empty" hidden>Kartan hittade inga anrop i koden.</p>
<script type="application/json" id="map-data">__MAP__</script>
<script type="application/json" id="mermaid-data">__MERMAID__</script>
<script type="application/json" id="hidden-data">__HIDDEN__</script>
__SCRIPTS__
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var json = JSON.parse($('map-data').textContent), mermaid = JSON.parse($('mermaid-data').textContent), hidden = JSON.parse($('hidden-data').textContent);
  $('empty').hidden = json.entryPoints.length > 0;
  var map = SystemMap.create($('map'), {
    // Mermaid-texten skrevs när sidan skapades, en för varje nivå och anrop, vänster till höger. Uppifrån och ned skiljer
    // sig bara på första raden. Det som är dolt i sidan och delar som inte nås avbockade finns inte i de skrivna filerna: då vägrar
    // knappen själv (systemmap.js) och talar om hur man får en fil utan dem.
    hidden: hidden,
    // Delar som ingen ingång når visas från början om inte sidan skapades med --no-unreached; det man själv väljer sparas och gäller före.
    unreached: __UNREACHED__,
    mermaid: function (level, direction, entry) {
      var text = mermaid[level + '|' + (entry || '')];
      if (!text) return Promise.reject({ message: 'Mermaid-filen för det här valet finns inte i sidan.', tip: 'Skapa sidan på nytt.' });
      return Promise.resolve(direction === 'TB' ? text.replace(/^flowchart LR/, 'flowchart TB') : text);
    }
  });
  map.show(json);
})();
</script>
</body>
</html>
