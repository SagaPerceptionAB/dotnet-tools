# Konfiguration för testgen (deterministisk generering, ingen AI vid körning)
spec: ../samples/shop.openapi.yaml   # relativt den här filen, liksom output
output: tests/Api.Tests/scenarios/generated

# Bas-seed; en stabil seed per operation härleds (FNV) ur denna + operationId.
seed: 12345
locale: sv

# Fältregler: matchas på fältnamn (skiftlägesokänsligt, regex tillåtet).
fieldRules:
  name: person.fullName
  email: internet.email
  phone: phone.number
  personnummer: se.personnummer   # Luhn-giltigt
  orgnr: se.organisationsnummer   # Luhn-giltigt
  sku: pattern                    # följer schemats pattern

# Beroenden: fält som fylls från svaret av en annan operation.
bindings:
  createOrder:
    customerId: ${createCustomer.id}
    productId: ${createProduct.id}
  getOrder:
    id: ${createOrder.id}

# Fasta värden per operation och fält (högst prioritet efter enum).
overrides:
  createOrder:
    quantity: 2

# Operationer som inte ska generera scenarier.
skipOperations: []
