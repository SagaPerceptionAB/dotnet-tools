openapi: 3.0.3
info:
  title: ConfigApp
  version: "1"
paths:
  /ping:
    get:
      operationId: ping
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  pong: { type: boolean }
  /echo:
    get:
      operationId: echo
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
  /env:
    get:
      operationId: env
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
  /typed:
    post:
      operationId: typed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
        "400":
          description: bad request
